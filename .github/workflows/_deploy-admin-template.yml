name: "Deploy OWEN admin infrastructure and SPA"

on:
  workflow_call:
    inputs:
      env:
        description: "Destination environment (e.g. dev, stage)"
        required: true
        type: string
      run_id:
        description: "github.run_id"
        required: true
        type: string
      publish_spa:
        description: "Whether to build and publish the React Admin SPA"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    container: amazonlinux:latest
    timeout-minutes: 30

    steps:
      - name: "Install rust and cargo"
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo 'source $HOME/.cargo/env' >> ~/.bashrc
          source $HOME/.cargo/env

      - name: "Install dependencies with dnf"
        run: dnf install -y gcc gcc-c++ glibc-devel make python3-pip openssl openssl-devel tar gzip git

      - name: "Install cargo-lambda"
        run: pip3 install cargo-lambda

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Build admin_api"
        working-directory: aws/admin_api
        run: |
          source $HOME/.cargo/env
          cargo lambda build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: admin-lambda-binaries
          path: target/lambda/admin_api

  deploy-changes:
    runs-on: ubuntu-latest
    needs: build-binaries
    timeout-minutes: 45

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: admin-lambda-binaries
          path: admin-lambda-binaries/

      - name: "Copy binaries"
        run: |
          mkdir -p target/lambda/admin_api
          cp admin-lambda-binaries/bootstrap target/lambda/admin_api/bootstrap

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.IAM_WORKFLOW_ROLE_REVELATOR }}
          role-session-name: protocol-core-admin-session-${{ inputs.run_id }}
          role-duration-seconds: 1200

      - name: "Deploy AWS CloudFormation template"
        working-directory: aws/admin-infra
        run: make deploy-infra-${{ inputs.env }}

      - name: "Publish SPA"
        if: ${{ inputs.publish_spa }}
        working-directory: aws/admin-infra
        run: make publish-spa-${{ inputs.env }}
