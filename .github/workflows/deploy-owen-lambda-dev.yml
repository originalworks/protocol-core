name: "Deploy Owen infrastructure and code to AWS dev environment"

on:
  push:
    branches: [master]
    paths:
      - "owen/**"
      - "prover/**"
      - "aws/owen-infra/**"
      - "aws/aws_queue_consumer/**"
      - "aws/blobs_batch_sender/**"

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-owen-aa-template.yml
    with:
      env: "dev"
      run_id: ${{ github.run_id }}
    secrets:
      aws_iam_workflow_role: ${{ secrets.IAM_WORKFLOW_ROLE_REVELATOR_DEV_STAGE }}
