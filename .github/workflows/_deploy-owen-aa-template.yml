name: "Deploy Owen infrastructure and code to AWS dev environment"

on:
  workflow_call:
    inputs:
      env:
        description: "Destination environment (e.g. dev, stage)"
        required: true
        type: string
      run_id:
        description: "github.run_id"
        required: true
        type: string

# env:
#   FOUNDRY_PROFILE: ci

permissions:
  id-token: write
  contents: read

jobs:
  compile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.21"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: "Checkout"
        uses: actions/checkout@v7
        # with:
        #   submodules: recursive

      - name: "Install npm dependencies"
        working-directory: contracts
        run: npm i

      - name: "Build with forge"
        working-directory: contracts
        run: forge build

      - name: "Compile Protocol's conracts"
        working-directory: contracts
        run: npx hardhat compile

      - name: Upload contracts artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-artifacts
          path: |
            contracts/artifacts/

  build-owen-aa-binaries:
    runs-on: ubuntu-latest
    container: amazonlinux:latest
    needs: compile-contracts
    timeout-minutes: 30

    steps:
      - name: "Install rust and cargo"
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo 'source $HOME/.cargo/env' >> ~/.bashrc
          source $HOME/.cargo/env

      - name: "Install dependencies with dnf"
        run: dnf install -y gcc gcc-c++ glibc-devel make python3-pip openssl openssl-devel tar gzip git nasm

      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Download contracts artifacts"
        uses: actions/download-artifact@v4
        with:
          name: contracts-artifacts
          path: contracts-artifacts/

      - name: "Copy contracts artifacts"
        run: |
          mkdir -p contracts/artifacts
          cp -a contracts-artifacts/. contracts/artifacts/

      - name: "Install cargo-lambda"
        run: pip3 install cargo-lambda

      - name: "Build owen_lambda"
        working-directory: owen
        run: |
          source $HOME/.cargo/env
          cargo lambda build --release --bin aws_aa_owen_lambda --features aws-integration --compiler cargo

      - name: "Build aws_queue_consumer"
        working-directory: aws/aws_queue_consumer
        run: |
          source $HOME/.cargo/env
          cargo lambda build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: owen-lambda-binaries
          path: |
            target/lambda/aws_aa_owen_lambda
            target/lambda/aws_queue_consumer

  deploy-changes:
    runs-on: ubuntu-latest
    needs: build-owen-aa-binaries
    timeout-minutes: 30

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: owen-lambda-binaries
          path: owen-lambda-binaries/

      - name: "Copy binaries"
        run: |
          mkdir -p target/lambda/aws_aa_owen_lambda
          mkdir -p target/lambda/aws_queue_consumer
          cp owen-lambda-binaries/aws_aa_owen_lambda/bootstrap target/lambda/aws_aa_owen_lambda/bootstrap
          cp owen-lambda-binaries/aws_queue_consumer/bootstrap target/lambda/aws_queue_consumer/bootstrap

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.IAM_WORKFLOW_ROLE_REVELATOR_DEV_STAGE }}
          role-session-name: protocol-core-session-id-${{ inputs.run_id }}
          role-duration-seconds: 1200

      - name: "Deploy AWS Cloud Formation template"
        working-directory: aws/owen-infra
        run: make deploy-infra-${{ inputs.env }}
