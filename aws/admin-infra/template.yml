Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, stage, prod]
  MessageStatusTableName:
    Type: String
  ProcessingStatusIndexName:
    Type: String
    Default: ProcessingStatusIndex
  MessageFolderAttributeName:
    Type: String
    Default: messageFolder
  ProcessingStatusAttributeName:
    Type: String
    Default: processingStatus
  CreatedTimestampAttributeName:
    Type: String
    Default: createdTimestamp
  UpdatedTimestampAttributeName:
    Type: String
    Default: updatedTimestamp
  OwenInstanceAttributeName:
    Type: String
    Default: owenInstance
  IdentityCenterSamlMetadataUrl:
    Type: String
    Default: ""
    Description: "IAM Identity Center SAML metadata URL. Leave empty on first deploy, then set after creating the IdC custom SAML app."
  CognitoDomainPrefix:
    Type: String
    Description: "Globally unique Cognito hosted UI domain prefix"

Conditions:
  HasSamlMetadata: !Not [!Equals [!Ref IdentityCenterSamlMetadataUrl, ""]]
  NoSamlMetadata: !Equals [!Ref IdentityCenterSamlMetadataUrl, ""]

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - x86_64

Resources:
  AdminSpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "owen-admin-spa-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AdminSpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminSpaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AdminSpaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminSpaDistribution}"

  AdminSpaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "owen-admin-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminSpaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: SpaS3Origin
            DomainName: !GetAtt AdminSpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AdminSpaOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: SpaS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        PriceClass: PriceClass_100

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "owen-admin-${Environment}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolAddOns:
        AdvancedSecurityMode: OFF

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref AdminUserPool

  IdentityCenterSamlProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasSamlMetadata
    Properties:
      UserPoolId: !Ref AdminUserPool
      ProviderName: IAMIdentityCenter
      ProviderType: SAML
      ProviderDetails:
        MetadataURL: !Ref IdentityCenterSamlMetadataUrl
      AttributeMapping:
        email: email
        username: email

  AdminUserPoolClientBootstrap:
    Type: AWS::Cognito::UserPoolClient
    Condition: NoSamlMetadata
    Properties:
      ClientName: !Sub "owen-admin-spa-${Environment}"
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub "https://${AdminSpaDistribution.DomainName}/"
        - !Sub "https://${AdminSpaDistribution.DomainName}/auth-callback"
        - http://localhost:5173/
        - http://localhost:5173/auth-callback
      LogoutURLs:
        - !Sub "https://${AdminSpaDistribution.DomainName}/"
        - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  AdminUserPoolClientFederated:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasSamlMetadata
    DependsOn:
      - IdentityCenterSamlProvider
    Properties:
      ClientName: !Sub "owen-admin-spa-${Environment}"
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - IAMIdentityCenter
      CallbackURLs:
        - !Sub "https://${AdminSpaDistribution.DomainName}/"
        - !Sub "https://${AdminSpaDistribution.DomainName}/auth-callback"
        - http://localhost:5173/
        - http://localhost:5173/auth-callback
      LogoutURLs:
        - !Sub "https://${AdminSpaDistribution.DomainName}/"
        - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  AdminHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${AdminSpaDistribution.DomainName}"
          - http://localhost:5173
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - OPTIONS
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}"
              audience:
                - !If
                  - HasSamlMetadata
                  - !Ref AdminUserPoolClientFederated
                  - !Ref AdminUserPoolClientBootstrap

  AdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "owen-admin-api-${Environment}"
      CodeUri: ../../target/lambda/admin_api
      Handler: bootstrap
      Environment:
        Variables:
          MESSAGE_STATUS_TABLE_NAME: !Ref MessageStatusTableName
          PROCESSING_STATUS_INDEX_NAME: !Ref ProcessingStatusIndexName
          MESSAGE_FOLDER_ATTRIBUTE_NAME: !Ref MessageFolderAttributeName
          PROCESSING_STATUS_ATTRIBUTE_NAME: !Ref ProcessingStatusAttributeName
          CREATED_TIMESTAMP_ATTRIBUTE_NAME: !Ref CreatedTimestampAttributeName
          UPDATED_TIMESTAMP_ATTRIBUTE_NAME: !Ref UpdatedTimestampAttributeName
          OWEN_INSTANCE_ATTRIBUTE_NAME: !Ref OwenInstanceAttributeName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MessageStatusTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MessageStatusTableName}/index/*"
      Events:
        ListMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /messages
            Method: GET
        GetMessage:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /messages/{messageFolder+}
            Method: GET

Outputs:
  CloudFrontUrl:
    Description: Admin SPA URL
    Value: !Sub "https://${AdminSpaDistribution.DomainName}"
  ApiEndpoint:
    Description: Admin API base URL
    Value: !Sub "https://${AdminHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  UserPoolId:
    Value: !Ref AdminUserPool
  UserPoolClientId:
    Value: !If
      - HasSamlMetadata
      - !Ref AdminUserPoolClientFederated
      - !Ref AdminUserPoolClientBootstrap
  CognitoDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  SpaBucketName:
    Value: !Ref AdminSpaBucket
  CloudFrontDistributionId:
    Value: !Ref AdminSpaDistribution
  CognitoSamlAcsUrl:
    Description: Use as ACS URL in Identity Center custom SAML application
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/saml2/idpresponse"
  CognitoSamlEntityId:
    Description: Use as Application SAML audience / Entity ID in Identity Center
    Value: !Sub "urn:amazon:cognito:sp:${AdminUserPool}"
  CognitoSpMetadataUrl:
    Description: Cognito SP metadata URL for Identity Center application setup
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}"
